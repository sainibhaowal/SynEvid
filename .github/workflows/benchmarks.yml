name: Benchmark Harness & Regression Gate

on:
  schedule:
    # Run nightly at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Benchmark Profile (all, held-out, fast)'
        required: true
        default: 'all'

concurrency:
  group: benchmarks-regression
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  benchmark-regression-gate:
    name: Execute Benchmark Suite (5 Repos, 50 Tasks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Autopsy CLI Release Binary
        run: cargo build --release -p autopsy-cli

      - name: Execute Full Benchmark Harness (Baselines A, B, C)
        run: |
          python3 benchmarks/run_benchmarks.py

      - name: Verify Chapter 12 Pre-Registered Gate
        run: |
          cargo test -p autopsy-tests --test e2e_phase6_benchmarks -- test_benchmark_harness_execution_and_pre_registered_gate --nocapture

      - name: Generate Rich Benchmark Telemetry Summary
        run: |
          echo "## Synevid Benchmark Harness & Chapter 12 Gate Telemetry" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "benchmarks/results/reproduction_report.md" ]; then
            cat benchmarks/results/reproduction_report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "Telemetry report generated in benchmarks/results/." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Benchmark Results & Telemetry Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synevid-benchmark-results
          path: benchmarks/results/
