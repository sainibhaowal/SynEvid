name: Post-Merge Verification & Multi-Platform Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: post-merge-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  post-merge-audit:
    name: Post-Merge Golden Audit & Determinism
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Golden 100-Run Determinism Invariant
        run: ./scripts/verify-determinism.sh

      - name: Run Universal Hardware & Multi-Arch Verification (Pillar A)
        run: ./scripts/verify-cross-platform.sh

      - name: Verify Architecture Boundaries
        run: ./scripts/verify-arch-boundaries.sh

  cross-platform-builds:
    name: Build Release Binary (${{ matrix.target }})
    needs: post-merge-audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: autopsy
            pkg_type: tar.gz
            sys_pkg: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: autopsy
            pkg_type: tar.gz
            sys_pkg: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: autopsy
            pkg_type: tar.gz
            sys_pkg: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary_name: autopsy
            pkg_type: tar.gz
            sys_pkg: false
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: autopsy
            pkg_type: tar.gz
            sys_pkg: false
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: autopsy
            pkg_type: tar.gz
            sys_pkg: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: autopsy.exe
            pkg_type: zip
            sys_pkg: false
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux musl & RPM Packaging Tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools rpm

      - name: Install Rust Toolchain for Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build Optimized Release Binaries
        run: cargo build --release --target ${{ matrix.target }} -p autopsy-cli -p synevid-lsp

      - name: macOS Code Signing & Notarization (Gatekeeper readiness)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          for bin in "target/${{ matrix.target }}/release/autopsy" "target/${{ matrix.target }}/release/synevid-lsp"; do
            if [ -f "$bin" ]; then
              if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
                codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$bin"
              else
                codesign --force --sign - "$bin"
              fi
            fi
          done

      - name: Set up Node.js 22 (MCP bundle)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mcp-server/package-lock.json

      - name: Build Single-File MCP Server (zero-build agent surface)
        run: cd apps/mcp-server && npm ci --no-audit --no-fund && npm run build:bundle

      - name: Package Release Archive & System Packages (.deb / .rpm)
        shell: bash
        run: |
          DIST_DIR="autopsy-${{ matrix.target }}"
          mkdir -p "$DIST_DIR"

          BIN_BASE="${{ matrix.binary_name }}"
          LSP_NAME="${BIN_BASE/autopsy/synevid-lsp}"
          for name in "$BIN_BASE" "$LSP_NAME"; do
            if [ -f "target/${{ matrix.target }}/release/$name" ]; then
              cp "target/${{ matrix.target }}/release/$name" "$DIST_DIR/"
            elif [ -f "target/release/$name" ]; then
              cp "target/release/$name" "$DIST_DIR/"
            fi
          done

          mkdir -p "$DIST_DIR/mcp-server" "$DIST_DIR/hooks"
          cp apps/mcp-server/dist/index.bundle.js "$DIST_DIR/mcp-server/index.js"
          cp scripts/setup-agent-hosts.py "$DIST_DIR/"
          cp agents/hooks/safe-edit.sh agents/hooks/autopsy-session.sh agents/hooks/autopsy-task-complete.sh "$DIST_DIR/hooks/"

          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md "$DIST_DIR/"

          PKG="autopsy-${{ matrix.target }}.${{ matrix.pkg_type }}"
          if [ "${{ matrix.pkg_type }}" == "zip" ]; then
            7z a "$PKG" "$DIST_DIR"
          else
            tar -czvf "$PKG" "$DIST_DIR"
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$PKG" > "$PKG.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$PKG" > "$PKG.sha256"
          else
            python3 -c "import hashlib, sys; h=hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest(); print(f'{h}  {sys.argv[1]}')" "$PKG" > "$PKG.sha256"
          fi

          mkdir -p artifacts
          mv autopsy-${{ matrix.target }}.* artifacts/

          if [ "${{ matrix.sys_pkg }}" == "true" ]; then
            VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")"
            bash scripts/build-linux-packages.sh "$DIST_DIR" "${{ matrix.target }}" "$VERSION" artifacts/
          fi
          ls -lh artifacts/

      - name: Upload Platform Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autopsy-${{ matrix.target }}
          path: artifacts/

  release-manifest:
    name: Generate Aggregated Release Manifest, SBOM & Provenance
    needs: cross-platform-builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Generate CycloneDX SBOM for Release Binary
        run: |
          cargo install cargo-sbom --locked
          cargo sbom --cargo-package autopsy-cli --output-format cyclone_dx_json_1_5 > sbom-autopsy-cli.cdx.json
          python3 -c "import json; d=json.load(open('sbom-autopsy-cli.cdx.json')); print('SBOM components:', len(d.get('components', [])))"

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Consolidate Release Bundle, Manifests & SHA256SUMS
        run: |
          mkdir -p release-bundle
          find all-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release-bundle/ \;
          cp sbom-autopsy-cli.cdx.json release-bundle/
          cd release-bundle
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")"
          python3 scripts/render-package-manifests.py --sums release-bundle/SHA256SUMS.txt --version "$VERSION" --out-dir release-bundle/
          cd release-bundle
          sha256sum * > SHA256SUMS.txt
          echo "## Synevid Multi-Platform Release Manifest" >> $GITHUB_STEP_SUMMARY
          echo "| Filename | SHA256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          while read -r hash fname; do
            echo "| \`$fname\` | \`$hash\` |" >> $GITHUB_STEP_SUMMARY
          done < SHA256SUMS.txt

      - name: Install Cosign (Keyless Sigstore Signing)
        uses: sigstore/cosign-installer@v3

      - name: Sign SHA256SUMS.txt with Sigstore Keyless Cosign
        run: |
          cosign sign-blob --yes \
            --bundle release-bundle/SHA256SUMS.txt.sigstore.json \
            release-bundle/SHA256SUMS.txt

      - name: Generate SLSA Build Provenance Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-bundle/autopsy-*"

      - name: Upload Final Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: autopsy-release-bundle
          path: release-bundle/

  release-publish:
    name: Publish Rolling Latest Release
    needs: release-manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Final Release Bundle
        uses: actions/download-artifact@v4
        with:
          name: autopsy-release-bundle
          path: release-bundle

      - name: Resolve Release Tag from Workspace Version
        id: version
        run: |
          VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish / Refresh GitHub Release (rolling latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SynEvid ${{ steps.version.outputs.tag }}"
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
          files: release-bundle/*
