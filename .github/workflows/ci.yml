name: CI Quality & Cross-Platform Matrix

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main", "master", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-lint-and-format:
    name: Lint & Format Check (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Rust Code Formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Strict Clippy Linter (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  msrv-check:
    name: MSRV 1.90 Build (the declared rust-version)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install the declared MSRV toolchain
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Check the workspace at its declared floor
        # The floor is measured here, not asserted in a comment. The language needs 1.88
        # (`let`-chains); the dependency graph needs 1.90 (`tree-sitter-language@0.1.8`
        # declares rustc 1.90), which installing 1.88 locally proved. A declared
        # rust-version below the true floor tells a toolchain it can build this workspace
        # and then fails it inside a dependency.
        run: cargo check --workspace --all-targets

  cross-platform-matrix:
    name: Workspace Tests (${{ matrix.os.name }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
        include:
          - os:
              name: Linux
            arch: x86_64
          - os:
              name: macOS
            arch: aarch64 (Apple Silicon)
          - os:
              name: Windows
            arch: x86_64
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os.name }}-${{ matrix.arch }}

      - name: Run Workspace Unit & Integration Tests
        run: cargo test --workspace --all-targets -- --nocapture

      - name: Run Documentation Tests
        run: cargo test --workspace --doc

  determinism-and-boundary-gate:
    name: Determinism & Architecture Gate (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Golden 100-Run Determinism Invariant
        run: ./scripts/verify-determinism.sh

      - name: Run Universal Hardware & Multi-Arch Determinism (Pillar A)
        run: ./scripts/verify-cross-platform.sh

      - name: Verify Architectural Boundaries (Zero LLM/MCP in Core)
        run: ./scripts/verify-arch-boundaries.sh

  schemas-and-configs:
    name: Schemas & Configs Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML, Ruff and Pytest
        run: pip install pyyaml ruff pytest

      - name: Ruff Lint & Format Check (benchmarks)
        run: |
          ruff check benchmarks/
          ruff format --check benchmarks/

      - name: Pytest Harness Smoke Tests
        run: |
          python3 -m pytest benchmarks/tests/ -q

      - name: Validate All Public JSON Schemas
        run: |
          python3 -c '
          import glob, json, sys
          schemas = glob.glob("schemas/*.json")
          if not schemas:
              print("Error: No schemas found!")
              sys.exit(1)
          for s in schemas:
              with open(s, "r") as f:
                  data = json.load(f)
                  title = data.get("title", "unnamed")
                  print(f"Validated schema {s}: {title}")
          '

      - name: Validate autopsy.toml, invariants.yml & baseline.json Syntax
        run: |
          python3 -c '
          import tomllib, yaml, json
          with open("autopsy.toml", "rb") as f:
              tomllib.load(f)
          with open(".autopsy/invariants.yml", "r") as f:
              yaml.safe_load(f)
          with open(".autopsy/baseline.json", "r") as f:
              json.load(f)
          print("All engine configuration files validated.")
          '

  mcp-server-check:
    name: TypeScript MCP Server & Web Inspector Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Autopsy CLI
        run: cargo build -p autopsy-cli

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install MCP Server Dependencies
        run: cd apps/mcp-server && npm ci || npm install

      - name: Build and Test MCP Server
        run: cd apps/mcp-server && npm run typecheck && npm run lint && npm test

      - name: Test Web Inspector (headless, zero-build)
        run: cd apps/web-inspector && npm test

  supply-chain-audit:
    name: Cargo Deny (advisories, licenses, bans)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo-deny against deny.toml policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          command: check

  pre-merge-verification-gate:
    name: Pre-Merge Verification Gate
    runs-on: ubuntu-latest
    needs:
      - rust-lint-and-format
      - cross-platform-matrix
      - determinism-and-boundary-gate
      - schemas-and-configs
      - msrv-check
      - mcp-server-check
      - supply-chain-audit
    if: always()
    steps:
      - name: Assess All Prerequisite Gates & Generate Summary
        run: |
          echo "## Synevid Pre-Merge Gate Assessment" >> $GITHUB_STEP_SUMMARY
          echo "| Check / Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Formatting & Strict Clippy | ${{ needs.rust-lint-and-format.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Multi-Platform Matrix (Linux, macOS, Windows) | ${{ needs.cross-platform-matrix.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Determinism (100-Run) & Boundary Gate | ${{ needs.determinism-and-boundary-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Public Schemas & Engine Configurations | ${{ needs.schemas-and-configs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MSRV 1.90 Build (declared rust-version) | ${{ needs.msrv-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript MCP Server & Web Inspector | ${{ needs.mcp-server-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Supply-Chain Audit (cargo-deny) | ${{ needs.supply-chain-audit.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.rust-lint-and-format.result }}" != "success" ] || \
             [ "${{ needs.cross-platform-matrix.result }}" != "success" ] || \
             [ "${{ needs.determinism-and-boundary-gate.result }}" != "success" ] || \
             [ "${{ needs.schemas-and-configs.result }}" != "success" ] || \
             [ "${{ needs.msrv-check.result }}" != "success" ] || \
             [ "${{ needs.mcp-server-check.result }}" != "success" ] || \
             [ "${{ needs.supply-chain-audit.result }}" != "success" ]; then
            echo "❌ **ERROR: One or more pre-merge verification checks failed! Pull request merge is blocked.**" >> $GITHUB_STEP_SUMMARY
            echo "ERROR: One or more pre-merge verification checks failed!"
            exit 1
          fi

          echo "✅ **SUCCESS: All multi-platform tests, lints, schemas, boundaries, and determinism gates passed. Ready for merge.**" >> $GITHUB_STEP_SUMMARY
          echo "SUCCESS: All gates green."
