name: CI Quality & Cross-Platform Matrix

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main", "master", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-lint-and-format:
    name: Lint & Format Check (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Rust Code Formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Strict Clippy Linter (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  cross-platform-matrix:
    name: Workspace Tests (${{ matrix.os.name }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
        include:
          - os:
              name: Linux
            arch: x86_64
          - os:
              name: macOS
            arch: aarch64 (Apple Silicon)
          - os:
              name: Windows
            arch: x86_64
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os.name }}-${{ matrix.arch }}

      - name: Run Workspace Unit & Integration Tests
        run: cargo test --workspace --all-targets -- --nocapture

      - name: Run Documentation Tests
        run: cargo test --workspace --doc

  determinism-and-boundary-gate:
    name: Determinism & Architecture Gate (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Determinism Verification Script (100 Runs)
        run: ./scripts/verify-determinism.sh

      - name: Verify Zero LLM/MCP in Core Crates
        run: ./scripts/verify-arch-boundaries.sh

  schemas-and-configs:
    name: Schemas & Configs Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate All Public JSON Schemas
        run: |
          python3 -c '
          import glob, json, sys
          schemas = glob.glob("schemas/*.json")
          if not schemas:
              print("Error: No schemas found!")
              sys.exit(1)
          for s in schemas:
              with open(s, "r") as f:
                  data = json.load(f)
                  print(f"Validated schema {s}: {data.get(\"title\", \"unnamed\")}")
          '

      - name: Validate autopsy.toml & invariants.yml Syntax
        run: |
          python3 -c '
          import tomllib, yaml
          with open("autopsy.toml", "rb") as f:
              tomllib.load(f)
          with open(".autopsy/invariants.yml", "r") as f:
              yaml.safe_load(f)
          print("All engine configuration files validated.")
          '

  pre-merge-verification-gate:
    name: Pre-Merge Verification Gate
    runs-on: ubuntu-latest
    needs:
      - rust-lint-and-format
      - cross-platform-matrix
      - determinism-and-boundary-gate
      - schemas-and-configs
    if: always()
    steps:
      - name: Assess All Prerequisite Gates
        run: |
          if [ "${{ needs.rust-lint-and-format.result }}" != "success" ] || \
             [ "${{ needs.cross-platform-matrix.result }}" != "success" ] || \
             [ "${{ needs.determinism-and-boundary-gate.result }}" != "success" ] || \
             [ "${{ needs.schemas-and-configs.result }}" != "success" ]; then
            echo "ERROR: One or more pre-merge verification checks failed!"
            exit 1
          fi
          echo "SUCCESS: All multi-platform tests, lints, schemas, boundaries, and determinism gates passed. Ready for merge."
