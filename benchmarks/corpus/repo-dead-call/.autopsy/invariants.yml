version: "0.0.1"
invariants:
  - id: "no-circular-deps"
    description: "No circular dependencies permitted"
    kind: "no_new_cycle"
    severity: "error"
  - id: "clean-active-pipeline"
    description: "Active pipeline must not import obsolete handlers"
    kind: "forbidden_dependency"
    severity: "error"
    scope:
      source: "src/active/**"
      target: "src/obsolete/**"
