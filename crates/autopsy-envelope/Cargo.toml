[package]
name = "autopsy-envelope"
version = "0.6.0"
edition = "2021"
rust-version = "1.90"
description = "Shared evidence envelope for SynEvid - canonical response format with BLAKE3 digest verification"
license = "MIT OR Apache-2.0"
categories = ["development-tools", "data-structures"]
repository = "https://github.com/sainibhaowal/SynEvid"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
schemars = { version = "0.8", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4"