[package]
name = "autopsy-daemon"
version = "0.6.0"
edition = "2021"
rust-version = "1.90"
description = "SynEvid Authenticated Local Daemon — Thin wrapper for synevid-ui"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/sainibhaowal/SynEvid"
publish = false

[dependencies]
synevid-ui = { path = "../../apps/synevid-ui" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "signal", "fs", "net", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1.5"

[dev-dependencies]
tempfile = "3.10"
serial_test = "3.0"

[[bin]]
name = "autopsy-daemon"
path = "src/main.rs"