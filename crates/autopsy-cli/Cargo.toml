[package]
name = "autopsy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Offline, deterministic software verification, change-impact, and agent forensic engine"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/autopsy-{ target }.tar.gz"
bin-dir = "autopsy"
pkg-fmt = "tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
pkg-url = "{ repo }/releases/download/v{ version }/autopsy-{ target }.zip"
bin-dir = "autopsy.exe"

[[bin]]
name = "autopsy"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
autopsy-domain = { path = "../autopsy-domain" }
autopsy-repo = { path = "../autopsy-repo" }
autopsy-adapter-api = { path = "../autopsy-adapter-api" }
autopsy-adapter-typescript = { path = "../autopsy-adapter-typescript" }
autopsy-adapter-python = { path = "../autopsy-adapter-python" }
autopsy-adapter-go = { path = "../autopsy-adapter-go" }
autopsy-adapter-rust = { path = "../autopsy-adapter-rust" }
autopsy-adapter-java = { path = "../autopsy-adapter-java" }
autopsy-adapter-csharp = { path = "../autopsy-adapter-csharp" }
autopsy-symbols = { path = "../autopsy-symbols" }
autopsy-graph = { path = "../autopsy-graph" }
autopsy-diff = { path = "../autopsy-diff" }
autopsy-impact = { path = "../autopsy-impact" }
autopsy-contracts = { path = "../autopsy-contracts" }
autopsy-invariants = { path = "../autopsy-invariants" }
autopsy-evidence = { path = "../autopsy-evidence" }
autopsy-storage = { path = "../autopsy-storage" }
autopsy-workspace-registry = { path = "../autopsy-workspace-registry" }
autopsy-report = { path = "../autopsy-report" }
autopsy-plugin-api = { path = "../autopsy-plugin-api" }
autopsy-graph-layout = { path = "../autopsy-graph-layout" }
autopsy-git-engine = { path = "../autopsy-git-engine" }
# Phase 4.2 engines (Pillar 1–6), reached only through their public APIs.
autopsy-temporal = { path = "../autopsy-temporal" }
autopsy-test-impact = { path = "../autopsy-test-impact" }
autopsy-contracts-distributed = { path = "../autopsy-contracts-distributed" }
autopsy-telemetry = { path = "../autopsy-telemetry" }
autopsy-mining = { path = "../autopsy-mining" }
autopsy-catalog = { path = "../autopsy-catalog" }
crossterm = { workspace = true }
ratatui = { workspace = true }
notify = { workspace = true }
tiny_http = { workspace = true }

[dev-dependencies]
# The lineage fixture builds real git objects without a git subprocess: a loose object is
# `zlib("<kind> <len>\0<payload>")` named by its SHA-1 over the *uncompressed* form. Writing
# them with these two crates keeps the gate hermetic (no git binary, no global config, no
# clock) and keeps the engine's zero-subprocess invariant untouchable even from tests.
flate2 = { workspace = true }
sha1 = { workspace = true }
