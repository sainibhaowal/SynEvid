[package]
name = "autopsy-wasm-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic, capability-free WASM policy plugin loader for SynEvid"

[dependencies]
autopsy-domain = { path = "../autopsy-domain" }
autopsy-plugin-api = { path = "../autopsy-plugin-api" }
serde_json = { workspace = true }
thiserror = { workspace = true }
wasmi = { version = "2.0", default-features = false, features = ["std", "validate", "deterministic"] }

[dev-dependencies]
wat = "1"
