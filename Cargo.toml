[workspace]
resolver = "2"
members = [
    "crates/autopsy-domain",
    "crates/autopsy-repo",
    "crates/autopsy-adapter-api",
    "crates/autopsy-adapter-typescript",
    "crates/autopsy-adapter-python",
    "crates/autopsy-adapter-go",
    "crates/autopsy-adapter-rust",
    "crates/autopsy-symbols",
    "crates/autopsy-graph",
    "crates/autopsy-diff",
    "crates/autopsy-impact",
    "crates/autopsy-contracts",
    "crates/autopsy-invariants",
    "crates/autopsy-evidence",
    "crates/autopsy-storage",
    "crates/autopsy-report",
    "crates/autopsy-cli",
    "crates/autopsy-temporal",
    "crates/autopsy-test-impact",
    "crates/autopsy-contracts-distributed",
    "crates/autopsy-telemetry",
    "crates/autopsy-mining",
    "crates/autopsy-catalog",
    "crates/autopsy-hidden-coupling",
    "crates/autopsy-incidents",
    "crates/autopsy-behavior-research",
    "crates/autopsy-schema-registry",
    "crates/autopsy-workspace-registry",
    "tests"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
# The floor is measured, not inferred. The language sets a 1.88 minimum (`let`-chains,
# `if let Some(x) = y && let Some(z) = w`, are used throughout the adapters and engines),
# and the dependency graph sets 1.90: `tree-sitter-language@0.1.8` declares rustc 1.90.
# Installing 1.88 and running the workspace proved it: `cargo +1.88.0 check` refused the
# tree, and `cargo +1.90.0 check --workspace --all-targets` passes cleanly. The
# `msrv-check` CI job pins the same toolchain, so a dependency that raises the floor
# turns the gate red instead of silently invalidating this number.
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde_yaml = "0.9"
ignore = "0.4"
glob = "0.3"
petgraph = { version = "0.8", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# Pure-Rust, C-free zlib for read-only git object decompression.
# rust_backend (miniz_oxide) keeps cross-platform bytes identical (NFR-001).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha1 = { version = "0.10", default-features = false }
