[workspace]
resolver = "2"
members = [
    "crates/autopsy-domain",
    "crates/autopsy-repo",
    "crates/autopsy-adapter-api",
    "crates/autopsy-adapter-typescript",
    "crates/autopsy-adapter-python",
    "crates/autopsy-symbols",
    "crates/autopsy-graph",
    "crates/autopsy-diff",
    "crates/autopsy-impact",
    "crates/autopsy-contracts",
    "crates/autopsy-invariants",
    "crates/autopsy-evidence",
    "crates/autopsy-storage",
    "crates/autopsy-report",
    "crates/autopsy-cli",
    "crates/autopsy-temporal",
    "crates/autopsy-test-impact",
    "crates/autopsy-contracts-distributed",
    "crates/autopsy-telemetry",
    "crates/autopsy-mining",
    "crates/autopsy-catalog",
    "tests"
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
# The floor is set by the language, not by preference: `let`-chains (`if let Some(x) = y
# && let Some(z) = w`) are used throughout the adapters and the engines, and they were
# stabilised in Rust 1.88. A lower number would tell a 1.85 toolchain it can build this
# workspace and then fail it inside the engine. Verified by the `msrv-check` CI job.
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde_yaml = "0.9"
ignore = "0.4"
glob = "0.3"
petgraph = { version = "0.8", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# Pure-Rust, C-free zlib for read-only git object decompression.
# rust_backend (miniz_oxide) keeps cross-platform bytes identical (NFR-001).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha1 = { version = "0.10", default-features = false }
